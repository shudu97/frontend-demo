<!--
  RiskMind training · Session 3 (Plugin) master file. Built segment by segment.
  Main line: the fxo-plugin folder. Its tree is the section divider; each section opens one entry.
  Segment 1 · Opening: the RiskMind logo → a click → the four rings (only the outer ring, Business Plugin, lit)
  (inner three together, then Business Plugin on its own as the ball moves left) → one line out to the right
  → the line reaches a card (Session 2's frame) with the Agent SDK's definition only → the card grows a dashed line under
  the definition (plugins) and the box below it with three plugin folders → a click on fxo-plugin: it becomes the box's
  label, the other folders go, its three parts come in (the divider page; the rings stay) → room opens under the
  definition for "A plugin can include" and four chips; Skills and MCP servers land on skills and .mcp.json → a click on a part: the rings and the card go and
  the parts become the navigator on the left, only the current part opened.
  Every frame is drawn by render(t) from the time alone (no CSS transitions, no timers).
  Live controls (as in Sessions 1 and 2): Space play/pause (stops by itself at every stop) · ←/→ previous/next stop ·
  Home restart · F (or double-click) full screen. Export: ?export=1, then window.renderAt(t) per frame.
-->
<style>
:root{
  --bg:#FFFFFF; --fg:#16243A; --muted:#66778C; --line:#D5DEE9; --dash:#BCC6D2;
  --tile-bg:#EEF4FD; --tile-st:#A9C4EA; --ink:#1C5BB5; --hi:#1A73E8;
  --body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1015;overflow:hidden}
body{font-family:var(--body);color:var(--fg)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--bg);overflow:hidden;transform-origin:0 0}
#stage svg{position:absolute;left:0;top:0;font-family:var(--body)}
#hud{position:fixed;left:14px;bottom:20px;font:12px ui-monospace,Menlo,monospace;color:#8fa0ae;opacity:.7}
:fullscreen #hud{display:none}
:fullscreen,:fullscreen *{cursor:none!important}
:fullscreen #ctl,:fullscreen #ctl *{cursor:pointer!important}
#ctl{position:fixed;right:12px;bottom:10px;display:flex;gap:6px;z-index:5}
#ctl button{width:38px;height:38px;border:0;border-radius:9px;background:rgba(22,36,58,.45);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;opacity:.55;transition:opacity .15s}
#ctl button:hover{opacity:1}
:fullscreen #ctl button{background:rgba(255,255,255,.14)}
#ctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
body.export #ctl,body.export #hud{display:none}
</style>
</head>

/* stops: the logo (0) · plugins with three folders (OP.s2) · the fxo-plugin divider (OP.d1) · Plugin: the navigator (OP.p1)
   As in Session 2: the inner three rings open together, then Business Plugin grows on its own while the whole ball
   moves left, and the line reaches out to plugins, all in one go (no stop on the rings).
   A click on fxo-plugin: the rings go, the plugins frame becomes the fxo-plugin frame (fxo-plugin itself becomes its
   label) with its three parts side by side. That is the divider page Plugin, Skill and MCP all start from.
   A click on one part: the frame goes, the three parts turn into the navigator on the left (always all three, only the
   current one opened and lit) */

OP.mv0=OP.p0; OP.mv1=OP.p0+OP.pDur;          // the ball moves left as it grows

OP.fr0=OP.ln1-.05;                          // where the line arrives a card comes in, the definition only
