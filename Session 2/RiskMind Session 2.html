<!--
  RiskMind training · Session 2 master file. Scene 1: Agent Introduction (later scenes get merged in here).
  Restyled to match Session 1: DM Sans / DM Mono, white background, blue palette only (no green, purple or teal),
  Title Case labels, arrows as grey lines with chevron heads, Session 1 playback (stops at every turn).
  One real fxo-stress-pnl run (2026-08-11 vs 2026-08-10, GLOBALFINANCIALCRISISABS), turn by turn.
  Style: explainer (one idea per scene, built step by step, labels next to what they name).
  Layout: Context (left) · the Agent Loop (middle, drawn as in the Claude Agent SDK docs) · Files on disk (right:
  RiskMind built-ins, three Plugins the agent picks from, and the Workspace this run writes),
  with a step tracker + caption along the bottom.
  After each tool runs, its output splits three ways:
    file → Files on disk · location/result → back to the LLM along "tool result" · a block → Context.
  Every frame is drawn by render(t) from the time alone (no CSS transitions, no timers),
  so the same t always gives the same picture. That is what makes frame-by-frame export work.

  Live controls: Space play/pause · ←/→ previous/next turn · Home restart · F (or double-click) full screen
  Playback stops by itself at every turn; Space plays on to the next one. Bottom-right buttons: play/pause, full screen
  Export: open with ?export=1 and call window.renderAt(t) per frame (see export.mjs)
-->

.dsec h3{margin:0 0 10px;font:700 24px var(--display);color:#16243A}   /* the sample dashboard keeps its own black headings */
.dsec p{margin:0 0 12px;font:400 16px var(--body);line-height:1.6;color:#2a3540}
.dsec .src{display:inline-block;font:600 11.5px var(--mono);padding:3px 8px;border-radius:6px;margin:0 0 8px}
.fcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;margin:6px 0 34px}

/* live controls, as in Session 1 */
#hud{position:fixed;left:14px;bottom:20px;font:12px ui-monospace,Menlo,monospace;color:#8fa0ae;opacity:.7}
:fullscreen #hud{display:none}
:fullscreen,:fullscreen *{cursor:none!important}
:fullscreen #ctl,:fullscreen #ctl *{cursor:pointer!important}
#ctl{position:fixed;right:12px;bottom:10px;display:flex;gap:6px;z-index:5}
#ctl button{width:38px;height:38px;border:0;border-radius:9px;background:rgba(22,36,58,.45);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;opacity:.55;transition:opacity .15s}

body.export #ctl,body.export #hud{display:none}

/* ============ The real run ============ */
const UUID = "9e97706c-ec23-4cdb-bc75-cb2c7121c7a3";
const U8 = UUID.slice(0,8)+"…";
const CFG = {
  prompt: "/fxo-stress-pnl 2026-08-11 2026-08-10 GLOBALFINANCIALCRISISABS",
  reportTitle: "FXO Stress PnL — Global Financial Crisis Absolute, 2026-08-11 vs 2026-08-10",
  closing: "The model decides each step. The order is defined by the skill."
};
/* files on disk, in the order they appear */
const FILES = {
  csv:     {name:"8 CSV files",               desc:"fetched by MCP",       ext:"CSV",  disp:"8 CSV files"},
  md:      {name:"portfolio_analysis_….md",   desc:"analysis script",      ext:"MD",   disp:"portfolio_analysis\n_….md"},
  ajson:   {name:"portfolio_analysis_….json", desc:"analysis script",      ext:"JSON", disp:"portfolio_analysis\n_….json"},
  text:    {name:U8+"_text.json",            desc:"written by the LLM",   ext:"JSON", disp:U8+"\n_text.json"},
  figures: {name:U8+"_figures.json",         desc:"figures script",       ext:"JSON", disp:U8+"\n_figures.json"},
  html:    {name:U8+".html",                 desc:"render script",        ext:"HTML", disp:U8+".html"},
  blocks:  {name:U8+".json",                 desc:"render script",        ext:"JSON", disp:U8+".json"}
};
/* ====================================== */

const TURN_LEN = 10, START = 8;
/* beats inside a tool turn (seconds from the turn start) — slow enough to read every pill */
const TM={call0:2.0, call1:3.4, on:3.3, run0:3.5, run1:4.7, out:4.7, res0:5.0, res1:6.8, mem:7.2};
const COL = {
  pur:  {bg:"var(--pur-bg)",  st:"var(--pur-st)",  t:"var(--pur-t)",  hex:"#5B8FD9"},
  teal: {bg:"var(--teal-bg)", st:"var(--teal-st)", t:"var(--teal-t)", hex:"#7FA9E6"},
  llm:  {bg:"var(--llm-bg)",  st:"var(--llm-st)",  t:"var(--llm-t)",  hex:"#1A73E8"},
  neu:  {bg:"var(--neu-bg)",  st:"var(--neu-st)",  t:"var(--neu-t)",  hex:"#98A3B0"},
  base: {bg:"var(--base-bg)", st:"var(--base-st)", t:"var(--base-t)", hex:"#98A3B0"},
  done: {bg:"var(--done-bg)", st:"var(--done-st)", t:"var(--done-t)", hex:"#1A73E8"},
  acc:  {bg:"var(--accent-soft)", st:"var(--accent)", t:"var(--accent)", hex:"#1C5BB5"}
};
const TOOLCOL = {Skill:"pur", Bash:"teal", MCP:"teal", Read:"neu", Write:"llm", Edit:"neu"};   // Write = the LLM's own words, highlighted

/* Context block sizes (px). Height shows how much text enters context. */
const H = {base1:46, base2:40, base3:56, L:88, LL:100, M:54, T:30, R:50};

/* Turn table: the real run.
   out = files written · in = files the script reads from disk · back = what rides "tool result" to the LLM */
const TURNS = [
  {decide:"Load the fxo-stress-pnl skill", tool:"Skill", call:"fxo-stress-pnl", pill:"Skill · fxo-stress-pnl",
   ret:"skill steps and rules", back:"SKILL.md",
   blk:{label:"Skill steps and rules", sub:"fxo-stress-pnl", h:H.L, c:"pur"},
   cap:"From the prompt, the agent picks the FX Option plugin's skill"},
  {decide:"Fetch the data", tool:"MCP", call:"fetch data · 2026-08-11, 2026-08-10", pill:"MCP · fetch data",
   ret:"8 file locations", back:"→ 8 CSV paths", out:["csv"],
   blk:{label:"Data file locations", sub:"→ 8 CSV paths", h:H.T, c:"teal"},
   cap:"MCP saves 8 CSV files. Only the locations come back."},
  {decide:"Run the analysis", tool:"Bash", call:"portfolio_analysis.py --scenario GLOBALFINANCIALCRISISABS", pill:"Bash · portfolio_analysis.py",
   ret:"locations of the .md and .json (from the log)", back:"→ .md + .json paths", in:["csv"], out:["md","ajson"],
   blk:{label:"Analysis file locations", sub:"→ .md + .json", h:H.T, c:"teal"},
   cap:"A script digests the data. Only the locations come back."},
  {decide:"Read the analysis markdown", tool:"Read", call:"portfolio_analysis_2026-08-11_2026-08-10.md", pill:"Read · portfolio_analysis_….md",
   ret:"full markdown content", read:"md",
   blk:{label:"Analysis markdown", sub:"9 data checks passed · …", h:H.LL, c:"neu"},
   cap:"The only data the agent reads"},
  {decide:"Generate the UUID", tool:"Bash", call:"uuidgen | tr '[:upper:]' '[:lower:]'", pill:"Bash · uuidgen",
   ret:UUID, back:U8,
   blk:{label:"UUID", sub:UUID, h:H.T, c:"teal"},
   cap:"A UUID names this run's files"},
  {decide:"Write the commentary as text JSON", tool:"Write", call:U8+"_text.json",
   ret:"file written", back:"file written", write:"commentary + figure titles", out:["text"],
   blk:{label:"Commentary + figure titles", sub:"written by the LLM", h:H.M, c:"llm"},
   cap:"The only part the LLM generates: commentary and figure titles"},
  {decide:"Build the figures", tool:"Bash", call:"generate_portfolio_figures.py", pill:"Bash · generate_portfolio_figures.py",
   ret:"location of the figures json", back:"→ "+U8+"_figures.json", in:["ajson","text"], out:["figures"],
   blk:{label:"Figures location", sub:"→ _figures.json · not read", h:H.T, c:"teal"},
   cap:"A script builds the charts. The agent never reads them."},
  {decide:"Load render-html", tool:"Skill", call:"render-html", pill:"Skill · render-html",
   ret:"render-html instructions", back:"SKILL.md",
   blk:{label:"render-html instructions", sub:"render-html", h:H.M, c:"pur"},
   cap:"A skill loads another skill, built into RiskMind"},
  {decide:"Render", tool:"Bash", call:"render.py --title \"FXO Stress PnL — …\"", pill:"Bash · render.py",
   ret:"locations of the .html and blocks .json", back:"→ .html + .json paths", in:["figures","text"], out:["html","blocks"],
   blk:{label:"Dashboard locations", sub:"→ .html + .json", h:H.T, c:"teal"},
   cap:"Commentary and figures become the dashboard"},
  {decide:"Emit turn output", tool:"MCP", call:"emit_turn_output(kind=\"report_tab\")", pill:"MCP · emit_turn_output",
   ret:"dashboard shown", back:"dashboard shown", show:"html",
   blk:{label:"Dashboard shown", sub:"emit_turn_output", h:H.T, c:"teal"},
   cap:"An internal MCP tool shows the dashboard in a tab"},
  {decide:"Finish, no more tool calls", tool:null, final:true,
   blk:{label:"Final reply", sub:"summary + dashboard", h:H.R, c:"done"},
   cap:"No more tool calls. The run is done."}
];
TURNS.forEach((T,i)=>{T.n=i+1;T.t0=START+i*TURN_LEN;});
const NT = TURNS.length;
const END_T = TURNS[NT-1].t0 + 5.6;    // the final answer lands, then the stop (no still frames)
const DURATION = END_T + 10;           // end frame scrolls through the dashboard
const CHAPTERS = [0, ...TURNS.map(x=>x.t0), END_T];
/* playback is faster than the run's own clock in the tool turns: the call / run / result loop is compressed and the
   wait after the block lands is cut. RUN_IN / RUN_EX: knots (internal → played); outside the tool turns, 1:1. */
const TURN_IN=[0,2.0,3.4,4.7,6.8,8.0,TURN_LEN], TURN_EX=[0,1.4,2.4,3.2,4.6,5.5,5.8];
const RUN_IN=[0], RUN_EX=[0];
TURNS.forEach(T=>{if(!T.tool)return;const e0=RUN_EX[RUN_EX.length-1]+(T.t0-RUN_IN[RUN_IN.length-1]);
  TURN_IN.forEach((k,j)=>{RUN_IN.push(T.t0+k);RUN_EX.push(e0+TURN_EX[j]);});});
const knot=(A,B,x)=>{if(x<=A[0])return x-A[0]+B[0];for(let i=1;i<A.length;i++)if(x<=A[i])return A[i]===A[i-1]?B[i]:lerp(B[i-1],B[i],(x-A[i-1])/(A[i]-A[i-1]));return x-A[A.length-1]+B[B.length-1];};
const runInt=e=>knot(RUN_EX,RUN_IN,e), runExt=i=>knot(RUN_IN,RUN_EX,i);

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-p,3);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const pr=(t,a,b,f=eo)=>f(clamp((t-a)/(b-a)));
const S=document.getElementById("stage");
function el(tag,cls,parent=S,html=""){const e=document.createElement(tag);if(cls)e.className=cls;e.innerHTML=html;parent.appendChild(e);return e;}
function css(e,o){for(const k in o)e.style[k]=o[k];}
const px=v=>v+"px";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* point at fraction q along a polyline */
function along(pts,q){
  const segs=[];let tot=0;
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(d);tot+=d;}
  let r=q*tot;
  for(let i=0;i<segs.length;i++){if(r<=segs[i]||i===segs.length-1){const f=segs[i]?clamp(r/segs[i]):0;return[lerp(pts[i][0],pts[i+1][0],f),lerp(pts[i][1],pts[i+1][1],f)];}r-=segs[i];}
  return pts[pts.length-1];
}

/* ---------- layout ---------- */
const LANE_T=150, LANE_B=1040, LANE_H=LANE_B-LANE_T;
const LC={x:60,w:520}, LA={x:600,w:780}, LR={x:1400,w:460};   // Context (memory cloud) · Agent · Files

/* lanes */
function lane(L,html){const l=el("div","lane");css(l,{left:px(L.x),top:px(LANE_T),width:px(L.w),height:px(LANE_H)});el("div","lane-h",l,html);return l;}
const laneC=lane(LC,"<b>Context</b> · The LLM's Memory");
css(laneC,{background:"transparent",border:"none",boxShadow:"none"});
css(laneC.querySelector(".lane-h"),{left:"50px",top:"50px"});
/* a scalloped cloud that grows downward as memory fills.
   Top and side bumps sit at fixed positions measured from the top, so growing only
   stretches the lowest side bump (and adds a new one) — the outline never shimmers. */
const CLOUD={x0:28,y0:26,x1:LC.w-28,R:64,minH:250};
const hsh=k=>.5+.5*Math.sin(k*2.39+1.3);
function cloudPath(y1){
  const {x0,y0,x1,R}=CLOUD, P=[];
  const corner=(cx,cy,a0)=>{for(const f of [.5,1])P.push([cx+R*Math.cos(a0+f*Math.PI/2),cy+R*Math.sin(a0+f*Math.PI/2)]);};
  // top edge, left → right
  for(let x=x0+R,k=0;x<x1-R-40;x+=86+26*hsh(k++))P.push([x,y0]);
  P.push([x1-R,y0]); corner(x1-R,y0+R,-Math.PI/2);
  // right edge, top → bottom (fixed stops from the top)
  const side=[];for(let y=y0+R,k=0;;k++){y+=80+28*hsh(k+7);if(y>y1-R-.6*80)break;side.push(y);}
  side.forEach(y=>P.push([x1,y])); P.push([x1,y1-R]); corner(x1-R,y1-R,0);
  // bottom edge, right → left
  for(let x=x1-R,k=0;x>x0+R+40;k++){x-=86+26*hsh(k+3);if(x>x0+R+40)P.push([x,y1]);}
  P.push([x0+R,y1]); corner(x0+R,y1-R,Math.PI/2);
  // left edge, bottom → top (same fixed stops, reversed)
  side.slice().reverse().forEach(y=>P.push([x0,y])); P.push([x0,y0+R]); corner(x0+R,y0+R,Math.PI);
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<P.length;i++){const A2=P[i],B=P[(i+1)%P.length],ch=Math.hypot(B[0]-A2[0],B[1]-A2[1]);
    if(ch<1)continue; d+=` A${(ch*.62).toFixed(1)},${(ch*.62).toFixed(1)} 0 0 1 ${B[0].toFixed(1)},${B[1].toFixed(1)}`;}
  return d+"Z";
}
const cloudSvg=document.createElementNS("http://www.w3.org/2000/svg","svg");
cloudSvg.setAttribute("width",LC.w);cloudSvg.setAttribute("height",LANE_H);
css(cloudSvg,{position:"absolute",left:"0",top:"0",overflow:"visible"});
cloudSvg.innerHTML=`<path fill="#F7FAFE" stroke="#A9C4EA" stroke-width="2"/>`;

  const dIn2=pr(t,-.4,0);
  [...secs,...divs].forEach(e=>e.style.opacity=dIn2);
  const T1=TURNS[0].t0, sel=pr(t,T1+TM.on,T1+TM.on+.6);
  const use=T&&USES[T.n]&&u>=TM.on&&u<TM.res1?USES[T.n]:null;
  const bump=a=>pr(t,a-.3,a+.1)*(1-pr(t,a+1.1,a+1.7));
  function paint(e,c,g){if(!c||g<=.01){css(e,{borderColor:"var(--line)",background:"#fff",boxShadow:"none"});return;}
    const k=COL[c];css(e,{borderColor:k.st,background:k.bg,boxShadow:`0 0 0 ${(4*g).toFixed(2)}px ${k.hex}33`});}
  const gUse=use?pr(u,TM.on,TM.on+.4)*(1-pr(u,TM.res1-.4,TM.res1)):0;
  const gC=bump(BASE[0].at), gS=bump(BASE[2].at);
  if(use&&use[0]==="rhtml")paint(RM.rhtml.e,use[1],gUse);else paint(RM.rhtml.e,"acc",gS);
  if(use&&use[0]==="emit")paint(RM.emit.e,use[1],gUse);else paint(RM.emit.e,null,0);
  paint(RM.claude.e,"acc",gC);
  PLUG.forEach(P=>{
    if(P===FXO&&sel>0){const on=T&&T.n===1&&u<TM.res1;
      css(P.e,{borderColor:"var(--pur-st)",borderWidth:"2px",background:on?"var(--pur-bg)":"#fff",boxShadow:on?`0 0 0 ${(4*sel).toFixed(2)}px #5B8FD933`:"none",opacity:dIn2});}
    else{paint(P.e,"acc",gS);css(P.e,{borderWidth:"1.5px",opacity:dIn2*(1-.6*sel)});}
  });
  [RM.claude.e,RM.rhtml.e,RM.emit.e].forEach(e=>e.style.opacity=dIn2);
  const openP=pr(t,T1+TM.on+.2,T1+TM.on+1.0,eio);
  css(tree,{height:px(TREE_H*openP),opacity:openP>0?1:0,visibility:openP>0?"visible":"hidden",padding:openP>.15?"10px 12px":"0 12px"});
  css(treeLink,{height:px((SEC.tree-FXO.y-FXO.h)*openP)});
  for(const k in SC){const on=use&&use[0]===k;
    if(on){const c=COL[use[1]];css(SC[k],{borderColor:c.st,background:c.bg,color:c.t,boxShadow:`0 0 0 ${(4*gUse).toFixed(2)}px ${c.hex}33`});}
    else css(SC[k],{borderColor:"var(--line)",background:"#fff",color:"var(--fg)",boxShadow:"none"});}

  css(reportNote,{left:px(IX+IW),top:px(files.html.y+DOC.h+8),transform:"translateX(-100%)",whiteSpace:"nowrap",opacity:pr(t,SHOW_T+.3,SHOW_T+1.0)});

  /* after a tool runs, its output splits three ways:
       file → flies to Files on disk · result → lights "tool result" back to the LLM · memory → a block lands in the cloud */

  /* bottom band: caption + tracker */
  let kTxt,cTxt,kCol,ct0;
  if(t>=END_T){kTxt="Done";cTxt="Chat on the left, the dashboard on the right";kCol="#1A73E8";ct0=END_T;}
  else if(scene0&&t<BASE[3].at){kTxt="Start · Before the Prompt";cTxt="CLAUDE.md, the tool definitions, and every skill's name and description load first";kCol="#1C5BB5";ct0=.4;}
  else if(scene0){kTxt="Start · Scheduled Prompt";cTxt="Same as a normal chat. Only the prompt is generated in the background.";kCol="#1C5BB5";ct0=BASE[3].at;}
  else{kTxt=`Turn ${T.n} of ${NT} · ${T.tool||"No Tool Calls"}`;cTxt=T.cap;kCol=T.tool?COL[tc].hex:"#1A73E8";ct0=T.t0;}
  const cp=pr(t,ct0,ct0+.6), closingP=pr(t,END_T+4.5,END_T+5.3);
  setCap(capA,kTxt,cTxt,kCol,cp*(1-closingP),(1-cp)*14-closingP*14);
  setCap(capB,"The Idea to Remember",CFG.closing,"#1C5BB5",closingP,(1-closingP)*14);

  const idx=t>=END_T?STEPS.length:scene0?0:T.n;
  const fillTo=Math.min(idx,STEPS.length-1)-(t>=END_T?0:1)+(scene0?0:pr(u,0,.6));
  css(trackFill,{width:px(Math.max(0,(TX(clamp(fillTo,0,STEPS.length-1))-TX(0))))});
  tnodes.forEach((n,i)=>{
    const s=STEPS[i], sc=s.c?COL[s.c].hex:"#1C5BB5";
    if(i<idx){n.textContent="✓";css(n,{border:"2px solid var(--done-st)",background:"var(--done-st)",color:"#fff",transform:"scale(1)"});}
    else if(i===idx){n.textContent=i?String(i):"S";css(n,{border:`2.5px solid ${sc}`,background:"#fff",color:sc,transform:"scale(1.18)"});}
    else{n.textContent=i?String(i):"S";css(n,{border:"2px dashed #b8c2cb",background:"var(--bg)",color:"#8e9ba6",transform:"scale(1)"});}
    css(tlabs[i],{color:i===idx?sc:i<idx?"#3d4a56":"#9aa6b1"});
  });

  /* end frame morph: Context + Agent → chat, Files → dashboard; then scroll the dashboard */
  if(ending>0){
    const m=ending;
    chat.style.visibility=art.style.visibility="visible";
    css(chat,{left:px(LC.x),top:px(lerp(LANE_T,END_T0,m)),width:px(lerp(LA.x+LA.w-LC.x,600,m)),height:px(lerp(LANE_H,END_H,m)),opacity:clamp(m*3)});
    css(art,{left:px(lerp(LR.x,680,m)),top:px(lerp(LANE_T,END_T0,m)),width:px(lerp(LR.w,1180,m)),height:px(lerp(LANE_H,END_H,m)),opacity:clamp(m*3)});
    chatC.style.opacity=pr(t,END_T+1.4,END_T+2.4);
    artC.style.opacity=pr(t,END_T+1.6,END_T+2.6);
    const maxScroll=Math.max(0,docin.offsetHeight-doc.clientHeight);
    docin.style.transform=`translateY(${-maxScroll*pr(t,END_T+3.2,DURATION-.6,eio)}px)`;
  } else chat.style.visibility=art.style.visibility="hidden";
}

/* ---------- playback (as in Session 1) ---------- */
const hud=document.getElementById("hud");
function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080), ox=(innerWidth-1920*sc)/2, oy=(innerHeight-1080*sc)/2;
  S.style.transform=`translate(${ox}px,${oy}px) scale(${sc})`;
  // the time readout and the buttons stay inside the picture; in full screen the buttons sit in the screen's corner
  hud.style.left=`${ox+20}px`;hud.style.bottom=`${oy+24}px`;
  const c=document.getElementById("ctl"), fs=!!document.fullscreenElement;
  if(c){c.style.right=`${fs?12:ox+18}px`;c.style.bottom=`${fs?10:oy+16}px`;}}
const EXPORT=new URLSearchParams(location.search).has("export");
/* the whole file: the four layers (0 … INTRO), then the run (its own clock starts at INTRO) */
const TOTAL=EE;
function render(t){renderRun(runInt(t-INTRO));renderIntro(t);renderD0(t);renderH1(t);renderEnd(t);}
window.renderAt=t=>render(t);
window.DURATION=TOTAL;
window.CHAPTERS=[["Start",0],...LAYERS.map((L,i)=>[`Layer: ${L.name}`,LSTOP[i]]),["The LLM alone",DL.sA],["Augmented LLM: two MCP servers",DL.bS],["Augmented LLM: Muni off, one turn",DL.tA],["Agent Harness: as a computer",AN.s],["Agent Harness: the loop",HD.s1],["RiskMind as the application",AP.s],["Run start",INTRO],...TURNS.map(T=>[`Turn ${T.n}: ${T.decide}`,INTRO+runExt(T.t0)]),["End frame",INTRO+runExt(END_T)],["Dashboard, scrolled",EF],["Ending: RBC Assist Pro today",EA],["Ending: Standardized Agent",EB],["Ending: RiskMind",EC],["Ending: decoupled",EE]];
const STOPS=[0,...LSTOP,DL.sA,DL.bS,DL.tA,AN.s,HD.s1,AP.s,...CHAPTERS.slice(1).map(c=>INTRO+runExt(c)),EF,EA,EB,EC].sort((a,b)=>a-b);   // stops: every layer, the opening, every turn, the end frame
let T=0,playing=false,last=null;
function frame(now){if(playing){if(last!=null){let n=T+(now-last)/1000;
    const stop=STOPS.find(b=>b>T+1e-9);
    if(stop!=null&&n>=stop){n=stop;playing=false;}
    T=Math.min(TOTAL,n);}
  last=now;if(T>=TOTAL)playing=false;}else last=null;
  render(T);hud.textContent=`${T.toFixed(1)}s / ${TOTAL.toFixed(1)}s ${playing?'▶':'❚❚'}`;requestAnimationFrame(frame);}
if(EXPORT){document.body.classList.add("export");S.style.transform="none";render(0);}
else{
  const toggleFull=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});};
  fit();addEventListener("resize",fit);addEventListener("dblclick",toggleFull);document.addEventListener("fullscreenchange",fit);
  addEventListener("keydown",e=>{
    if(e.repeat){if(e.code==="Space")e.preventDefault();return;}      // a held key acts once
    if(e.code==="Space"){playing=!playing;e.preventDefault();}
    // → and ← always land on a stop and stay there; while playing, → finishes the current part instead of skipping one
    if(e.code==="ArrowRight"){T=STOPS.find(b=>b>T+0.01)??TOTAL;playing=false;last=null;}
    if(e.code==="ArrowLeft"){T=[...STOPS].reverse().find(b=>b<T-0.5)??0;playing=false;last=null;}
    if(e.code==="Home"){T=0;playing=false;}
    if(e.code==="KeyF")toggleFull();
  });
  // the two buttons, bottom right: play/pause (shows the current state) and full screen (Lucide icons)
  const ICON={play:'<path d="M6 4l14 8-14 8z"/>',pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
    full:'<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
    exit:'<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>'};
  const bPlay=document.getElementById("bPlay"), bFull=document.getElementById("bFull");
  const paint=()=>{const pk=playing?"pause":"play", fk=document.fullscreenElement?"exit":"full";
    if(bPlay.dataset.k!==pk){bPlay.dataset.k=pk;bPlay.innerHTML=`<svg viewBox="0 0 24 24">${ICON[pk]}</svg>`;}
    if(bFull.dataset.k!==fk){bFull.dataset.k=fk;bFull.innerHTML=`<svg viewBox="0 0 24 24">${ICON[fk]}</svg>`;}
    requestAnimationFrame(paint);};
  paint();
  bPlay.addEventListener("click",e=>{playing=!playing;e.currentTarget.blur();});
  bFull.addEventListener("click",e=>{toggleFull();e.currentTarget.blur();});   // blur: Space keeps meaning play/pause
  document.getElementById("ctl").addEventListener("dblclick",e=>e.stopPropagation());
  requestAnimationFrame(frame);
}
</script>
